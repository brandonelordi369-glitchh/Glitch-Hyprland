# Generated by matugen - Hyprlock colors

# Clock & Date
$clock-color = rgba({{colors.on_surface.default.hex_stripped}}b3)
$date-color = rgba({{colors.on_surface.default.hex_stripped}}b3)

# Lock icon
$lock-icon-color = rgba({{colors.primary.default.hex_stripped}}4d)

# Input field
$input-outer = rgba(0, 0, 0, 0)
# $input-inner = rgba({{colors.surface_container.default.hex_stripped}}0a)
$input-inner = rgba(148, 184, 193, 0.04)
$input-font = rgb({{colors.on_surface.default.hex_stripped}})
$input-placeholder = rgba({{colors.on_surface.default.hex_stripped}}99)


# Matugen-Official

$image = {{image}}
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
<* endfor *>
