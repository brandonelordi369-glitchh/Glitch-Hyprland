# Password Input Field
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height (0.2 - 0.8)
    dots_spacing = 0.2 # Scale of dots' absolute size (0.0 - 1.0)
    dots_center = true
    outer_color = $input-outer
    inner_color = $input-inner
    font_color = $input-font
    fade_on_empty = false
    font_family = Cartograph CF Bold Italic
    placeholder_text = <span foreground="##ffffff99">Hi, $USER</span>
    hide_input = false
    # position = 0, -153
    # position = 0, -233
    position = 0, -433
    halign = center
    valign = center

    dots_text_format = *
    font_size = 20
}
