# ============================================================================
# Hyprlock Configuration with Music Player Widget
# ============================================================================
source = ~/.config/hypr/generated/hyprlock-colors.conf

# ----------------------------------------------------------------------------
# Background
# ----------------------------------------------------------------------------
background {
    monitor =
    path = /home/halcyon/Pictures/eat-sleep-code-3840x2160-16019.png
    blur_passes = 2
    contrast = 0.9651
    brightness = 0.5500
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    # noise = 0.03
}
# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
    ignore_empty_input = true
    hide_cursor = true
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}
# ----------------------------------------------------------------------------
# Animations
# ----------------------------------------------------------------------------
animations {
    animation = fade, 1, 6, default
    animation = fadeIn, 1, 6, default
    animation = fadeOut, 1, 6, default
}
# ----------------------------------------------------------------------------
# Clock & Date Display
# ----------------------------------------------------------------------------
# Time (HOURS)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H")</span>"
    color = $primary
    font_size = 150
    font_family = SF Pro Display Bold
    position = 0, 325
    halign = center
    valign = center
}
# Time (MINUTES)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = $secondary
    font_size = 150
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $tertiary
    font_size = 15
    font_family = SF Pro Text
    position = 0, 40
    halign = center
    valign = center
}
# Lock Icon
label {
    monitor =
    # text = <span> </span>
    text = <span>󰍁</span>
    # color = rgba(216, 222, 233, 0.70)
    color = $lock-icon-color
    font_size = 24
    font_family = OpenDyslexicAlt Nerd Font Propo
    position = 0, -60
    halign = center
    valign = top
}
# ----------------------------------------------------------------------------
# User Profile
# ----------------------------------------------------------------------------
# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/Akuma5.png
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    # position = 0, -50
    # position = 0, -250
    position = 0, -300
    halign = center
    valign = center
}

# Username greeting
